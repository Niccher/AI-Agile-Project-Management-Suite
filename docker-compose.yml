# AI-Agile-Project-Management-Suite: Unified Docker Stack
# Usage:
#   bash scripts/deploy.sh   # One-click deployment pipeline
#   docker compose up -d     # Standard manual launch
#
# Production Standard Ports:
#   - Web Dashboard & API : http://localhost:${WEB_PORT:-80}
#   - ML AI Microservice  : http://localhost:${ML_PORT:-8000} (Swagger: /docs)
#   - MySQL 8.4 Database  : Port 3306 (Internal to Docker network only)
#   - Redis 7 Cache/Queue : Port 6379 (Internal to Docker network only)
#   - MinIO Object Store  : http://localhost:${MINIO_PORT:-9000} (Console: :${MINIO_CONSOLE_PORT:-9001})
#   - Dozzle Log Viewer   : http://localhost:${DOZZLE_PORT:-8888}

services:
  # ==========================================
  # 1. Database: MySQL 8.4 (Internal Only)
  # ==========================================
  mysql:
    image: mysql:8.4
    container_name: shared-mysql
    restart: unless-stopped
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-db_chege_jira}
    command: --sql-mode="STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - shared-network

  # ==========================================
  # 2. Cache & Task Queues: Redis (Internal Only)
  # ==========================================
  redis:
    image: redis:alpine
    container_name: shared-redis
    restart: unless-stopped
    expose:
      - "6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - shared-network

  # ==========================================
  # 3. Backend: Python FastAPI ML Service
  # ==========================================
  ml-chege-jira:
    build:
      context: ./services/ml
      dockerfile: Dockerfile
    image: ml-chege-jira:latest
    container_name: ml-chege-jira
    restart: unless-stopped
    ports:
      - "${ML_PORT:-8000}:8000"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - API_KEY=${ML_API_KEY:-chege_jira_ml_super_secret_key_2026}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_ROOT_PASSWORD:-root_password}
      - DB_NAME=${DB_NAME:-db_chege_jira}
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minio_admin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minio_super_secret_2026}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET_ATTACHMENTS=${S3_BUCKET_ATTACHMENTS:-agile-attachments}
      - MODELS_DIR=/app/models
      - DEFAULT_MODEL=${DEFAULT_MODEL:-phi3-mini}
      - N_GPU_LAYERS=0
      - N_THREADS=4
      - N_CTX=4096
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./services/ml/models:/app/models:rw
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      shared-network:
        aliases:
          - ml-chege-jira
          - ml-service

  # ==========================================
  # 4. Frontend & Core: CodeIgniter 4 WebApp
  # ==========================================
  chege-jira:
    build:
      context: ./services/web
      dockerfile: Dockerfile
    image: chege-jira-webapp:latest
    container_name: chege-jira-webapp
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    environment:
      - CI_ENVIRONMENT=${CI_ENVIRONMENT:-development}
      - app.baseURL=${APP_URL:-http://localhost:${WEB_PORT:-80}/}
      - database.default.hostname=mysql
      - database.default.database=${DB_NAME:-db_chege_jira}
      - database.default.username=root
      - database.default.password=${DB_ROOT_PASSWORD:-root_password}
      - database.default.DBDriver=MySQLi
      - database.default.port=3306
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-chege-jira:8000
      - ML_API_KEY=${ML_API_KEY:-chege_jira_ml_super_secret_key_2026}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minio_admin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minio_super_secret_2026}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET_ATTACHMENTS=${S3_BUCKET_ATTACHMENTS:-agile-attachments}
      - S3_BUCKET_AVATARS=${S3_BUCKET_AVATARS:-agile-avatars}
      - S3_BUCKET_BACKUPS=${S3_BUCKET_BACKUPS:-agile-backups}
      - S3_DIRECT_PRESIGNED=${S3_DIRECT_PRESIGNED:-true}
    volumes:
      - ./services/web:/var/www/html
      - web-vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ml-chege-jira:
        condition: service_started
    networks:
      - shared-network

  # ==========================================
  # 5. Object Storage: MinIO (S3 Compatible)
  # ==========================================
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: shared-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    expose:
      - "9000"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_super_secret_2026}
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - minio-data:/data
    networks:
      shared-network:
        aliases:
          - minio
          - shared-minio

  # ==========================================
  # 6. Observability: Dozzle Real-Time Log Viewer
  # ==========================================
  dozzle:
    image: amir20/dozzle:v8.11.8
    container_name: shared-dozzle
    restart: unless-stopped
    ports:
      - "${DOZZLE_PORT:-8888}:8080"
    environment:
      - DOZZLE_LEVEL=info
      - DOZZLE_NO_ANALYTICS=true
      - DOZZLE_AUTH_PROVIDER=${DOZZLE_AUTH_PROVIDER:-none}
      - DOZZLE_USERNAME=${DOZZLE_USER:-admin}
      - DOZZLE_PASSWORD=${DOZZLE_PASSWORD:-admin_password_123}
      - DOZZLE_FILTER=name=chege|shared|ml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - shared-network

volumes:
  mysql-data:
  redis-data:
  web-vendor:
  minio-data:

networks:
  shared-network:
    name: chege-shared-network
